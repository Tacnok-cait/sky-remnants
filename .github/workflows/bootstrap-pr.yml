name: bootstrap-source-from-pr

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  expand-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand verified M20 source snapshot
        run: |
          set -euo pipefail
          test -f bootstrap/skyremnants-m20-final-verified.tar.xz
          tar -xJf bootstrap/skyremnants-m20-final-verified.tar.xz
          rm -f bootstrap/skyremnants-m20-final-verified.tar.xz
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/bootstrap-pr.yml
          rmdir bootstrap 2>/dev/null || true
          chmod +x gradlew bootstrap-wrapper.sh scripts/*.sh scripts/*.py 2>/dev/null || true
      - name: Commit normal source tree to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[skip ci] Expand M20 final verified source baseline'
          git push origin HEAD:main
